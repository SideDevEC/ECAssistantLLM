name: Publish ECAssistant.LLM.Server NuGet Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 14.7.0)'
        required: true
        default: '14.7.0'
  push:
    tags:
      - 'llm-server-v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ECAssistant.LLM.csproj

      - name: Build server (Release)
        run: dotnet build ECAssistant.LLM.csproj --configuration Release --no-restore

      - name: Set version from tag or input
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/llm-server-v}"
            echo "version=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Pack NuGet package
        run: |
          dotnet pack ECAssistant.LLM.csproj \
            --configuration Release \
            --no-build \
            /p:PackageVersion=${{ steps.version.outputs.version }} \
            -o ./nupkg

      - name: Trim duplicate content trees (contentFiles + content root)
        run: python3 scripts/trim-nupkg.py ./nupkg/ECAssistant.LLM.Server.${{ steps.version.outputs.version }}.nupkg

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source https://nuget.pkg.github.com/SideDevEC/index.json \
            --skip-duplicate

      - name: Publish to nuget.org (API key — first publish only)
        if: ${{ env.NUGET_API_KEY != '' }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key $NUGET_API_KEY \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Log in to nuget.org via OIDC (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        continue-on-error: true
        with:
          user: SideDevEC

      - name: Publish to nuget.org (trusted publishing)
        if: ${{ steps.nuget-login.outputs.NUGET_API_KEY != '' }}
        continue-on-error: true
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecassistant-llm-server-${{ steps.version.outputs.version }}
          path: ./nupkg/*.nupkg
          retention-days: 30

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ECAssistant ${{ github.ref_name }}
          generate_release_notes: true
          files: ./nupkg/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
